apiVersion: apps/v1

kind: Deployment

metadata:
  name: tamp-education
  namespace: tamp-education
  labels:
    app: tamp-education

spec:
  replicas: 2

  selector:
    matchLabels:
      app: tamp-education

  template:
    metadata:
      labels:
        app: tamp-education

    spec:

      securityContext:
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: tamp-education

          image: tamp-education:1.3
          imagePullPolicy: Never

          ports:
            - containerPort: 8080
              protocol: TCP

          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "128Mi"
              cpu: "250m"

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001

            capabilities:
              drop:
                - ALL

          volumeMounts:
            - name: nginx-cache
              mountPath: /var/cache/nginx

            - name: nginx-run
              mountPath: /run

      volumes:
        - name: nginx-cache
          emptyDir: {}

        - name: nginx-run
          emptyDir: {}
