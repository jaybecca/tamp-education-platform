name: TAMP Education CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:

  security-and-build:

    name: Build and Security Scan

    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. Checkout repository
      # ==========================================

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7


      # ==========================================
      # 2. Set up Docker Buildx
      # ==========================================

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4


      # ==========================================
      # 3. Build Docker image
      # ==========================================

      - name: Build Docker image
        run: |
          docker build \
            --tag tamp-education:${{ github.sha }} \
            .


      # ==========================================
      # 4. Scan Dockerfile
      # ==========================================

      - name: Trivy Dockerfile scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: Dockerfile
          severity: HIGH,CRITICAL
          exit-code: 1


      # ==========================================
      # 5. Scan Docker image
      # ==========================================

      - name: Trivy image vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: tamp-education:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1


      # ==========================================
      # 6. Scan Kubernetes manifests
      # ==========================================

      - name: Trivy Kubernetes scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: k8s/
          severity: HIGH,CRITICAL
          exit-code: 1

      # ==========================================
      # 7. Scan repository for secrets
      # ==========================================

      - name: Trivy secret scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret
          format: table
          exit-code: 1
          skip-dirs: .git

# CI security pipeline
